# Date window. Dates are computed dynamically: a trailing `lookback_years`
# window ending today. Set explicit ISO dates (YYYY-MM-DD) to override.
date_window:
  lookback_years: 3
  start_date: null      # null => end_date - lookback_years
  end_date: null        # null => today

# Covariance estimator: "shrinkage" (Ledoit-Wolf) or "sample".
estimation_method: "shrinkage"

# Rebalancing cadence used by the backtester.
rebalance_frequency: "monthly"

# Annual risk-free rate (for Sharpe ratio / tangency portfolio).
risk_free_rate: 0.06

# Minimum number of return observations a ticker must have to be usable.
min_observations: 250
